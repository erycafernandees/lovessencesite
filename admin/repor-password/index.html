<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,nofollow,noarchive"/><meta name="referrer" content="no-referrer"/><title>Recuperar acesso | Love Essences</title><link rel="icon" href="/assets/love-essences-social-logo.png"/><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet"/><link rel="stylesheet" href="/admin/admin.css"/></head>
<body><main class="auth-shell"><section class="auth-card"><img src="/assets/love-essences-social-logo.png" alt="Love Essences"/><p class="eyebrow">Área reservada</p><h1>Recuperar acesso</h1>
<div id="request-view"><p>Introduz o email da tua conta para receberes um novo link de recuperação.</p><form id="request-form"><label>Email<input type="email" name="email" autocomplete="email" required/></label><button type="submit">Enviar link</button></form></div>
<div id="password-view" hidden><p>Escolhe uma nova palavra-passe para a tua conta.</p><form id="password-form"><label>Nova palavra-passe<input type="password" name="password" autocomplete="new-password" minlength="12" required/></label><label>Confirmar palavra-passe<input type="password" name="confirm" autocomplete="new-password" minlength="12" required/></label><button type="submit">Guardar palavra-passe</button></form></div>
<p id="feedback" role="status" aria-live="polite"></p><p><a href="/admin/">Voltar ao início de sessão</a></p></section></main>
<script src="/assets/js/commerce-config.js"></script><script type="module" src="/admin/repor-password/reset.js"></script></body></html>
