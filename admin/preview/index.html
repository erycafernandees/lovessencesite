<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pré-visualização | Gestão Love Essences</title><link rel="stylesheet" href="/admin/admin.css"><style>.preview-notice{padding:.8rem 4vw;background:#f1e3ef;color:#66135e;font-size:.8rem}.demo-row{cursor:default}.demo-row:hover{background:#fff}</style></head><body>
<div class="preview-notice"><strong>Pré-visualização do painel</strong> — dados fictícios, sem acesso a encomendas ou informações reais.</div>
<div class="admin-app"><header class="admin-header"><a class="brand" href="/">Love Essences <span>Gestão</span></a><div><span>Modo demonstração</span><a href="/admin/" class="text-button">Entrar no painel real</a></div></header>
<nav class="tabs"><button class="active" id="orders-tab">Encomendas</button><button id="projects-tab">Projetos personalizados</button></nav>
<section class="workspace"><div class="toolbar"><div><p class="eyebrow">Operação</p><h1 id="view-title">Encomendas</h1></div><button class="secondary" id="refresh-button">Atualizar demonstração</button></div>
<div class="summary-grid" id="summary-grid"></div><div class="filters"><label>Pesquisar<input id="admin-search" type="search" placeholder="Referência, nome ou email"></label><label>Estado<select id="admin-status"><option value="">Todos os estados</option></select></label><span id="results-count"></span></div>
<div class="table-card"><div class="table-scroll"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div></div></section></div>
<script>
const datasets={orders:[{ref:'LE-DEMO-001',name:'Cliente Exemplo A',status:'Em produção',amount:'32,90 €',date:'26/10/2026'},{ref:'LE-DEMO-002',name:'Cliente Exemplo B',status:'Confirmada',amount:'44,90 €',date:'25/10/2026'},{ref:'LE-DEMO-003',name:'Cliente Exemplo C',status:'Enviada',amount:'25,00 €',date:'24/10/2026'}],projects:[{ref:'PROJ-DEMO-001',name:'Cliente Exemplo D',status:'Em análise',amount:'A definir',date:'26/10/2026'},{ref:'PROJ-DEMO-002',name:'Cliente Exemplo E',status:'Orçamentado',amount:'50,00 €',date:'24/10/2026'}]};
let current='orders';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const rows=datasets[current],q=$('admin-search').value.toLowerCase(),status=$('admin-status').value;const found=rows.filter(r=>(!status||r.status===status)&&(!q||Object.values(r).some(v=>v.toLowerCase().includes(q))));$('view-title').textContent=current==='orders'?'Encomendas':'Projetos personalizados';$('summary-grid').innerHTML=[['Total de exemplo',rows.length],['Em curso',rows.filter(r=>r.status==='Em produção'||r.status==='Em análise').length],['Concluídas / enviadas',rows.filter(r=>r.status==='Enviada').length],['Dados','Fictícios']].map(x=>'<div class="summary-card"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');$('table-head').innerHTML='<tr><th>Referência</th><th>Cliente</th><th>Estado</th><th>Valor</th><th>Data</th></tr>';$('table-body').innerHTML=found.map(r=>'<tr class="demo-row"><td>'+esc(r.ref)+'</td><td>'+esc(r.name)+'</td><td><span class="badge">'+esc(r.status)+'</span></td><td>'+esc(r.amount)+'</td><td>'+esc(r.date)+'</td></tr>').join('')||'<tr><td colspan="5">Sem resultados</td></tr>';$('results-count').textContent=found.length+' resultados fictícios';}
function change(view){current=view;$('orders-tab').classList.toggle('active',view==='orders');$('projects-tab').classList.toggle('active',view==='projects');$('admin-search').value='';$('admin-status').innerHTML='<option value="">Todos os estados</option>'+[...new Set(datasets[view].map(r=>r.status))].map(s=>'<option>'+esc(s)+'</option>').join('');render();}
$('orders-tab').onclick=()=>change('orders');$('projects-tab').onclick=()=>change('projects');$('admin-search').oninput=render;$('admin-status').onchange=render;$('refresh-button').onclick=render;change('orders');
</script></body></html>
