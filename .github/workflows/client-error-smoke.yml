name: Verificar recolha de erros Love Essences (teste unico)

on:
  push:
    branches: [main]
    paths: [".github/workflows/client-error-smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-client-report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enviar um erro tecnico sintetico sem dados de cliente
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 \
            -o /tmp/config.js https://love-essences.pt/assets/js/commerce-config.js
          key=$(sed -n 's/.*supabaseAnonKey: "\([^"]*\)".*/\1/p' /tmp/config.js | head -n 1)
          test -n "$key"
          code=$(curl --silent --show-error --max-time 25 -o /tmp/result.json -w "%{http_code}" \
            -X POST https://qjtblalogacenjxponpi.supabase.co/functions/v1/client-error-report \
            -H "Origin: https://love-essences.pt" \
            -H "apikey: $key" \
            -H "Content-Type: application/json" \
            --data '{"category":"script_error","area":"other"}')
          if [ "$code" != "202" ]; then
            echo "::error::O endpoint de erros devolveu HTTP $code"
            exit 1
          fi
          echo "Erro de teste registado com sucesso (HTTP 202)"
