name: Deploy para GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Gerar páginas e ficheiros SEO
        run: python3 scripts/build_site.py --output _site

      - name: Validar SEO gerado
        run: python3 scripts/validate_site.py --output _site

      - name: Carregar ficheiros
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
