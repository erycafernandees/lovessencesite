name: Deploy para GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Gerar páginas e ficheiros SEO
        run: python3 scripts/build_site.py --output _site

      - name: Validar SEO gerado
        run: python3 scripts/validate_site.py --output _site

      - name: Carregar ficheiros
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Aguardar disponibilidade dos ficheiros
        uses: actions/github-script@v7
        with:
          script: |
            const name = 'pages-${{ github.run_id }}-${{ github.run_attempt }}';
            for (let attempt = 0; attempt < 20; attempt++) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: context.runId, per_page: 100
              });
              if (artifacts.some(artifact => artifact.name === name && !artifact.expired)) return;
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            core.setFailed('Os ficheiros da publicação ainda não estão disponíveis.');

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
